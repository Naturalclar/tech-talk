name: CI

on:
  push:
    branches:
      - master
  pull_request:

# Only one deploy at a time, and a newer push wins. Cancelling an in-flight
# deploy is not safe, so a running one is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Must come before setup-node: the pnpm cache lookup needs pnpm on PATH.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --with-deps installs the browser's system libraries too, which is what
      # lets this job track ubuntu-latest instead of pinning an older image.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm run lint

      # node runs scripts/ by stripping the types, never checking them, so
      # nothing in the build would notice a type error. This step is the check.
      - name: Typecheck
        run: pnpm run typecheck

      # Only og-image.ts is covered. It talks to hosts nobody here controls,
      # so its failure paths are the ones worth pinning down; the test serves
      # its own fixtures and never leaves localhost.
      - name: Test
        run: pnpm run test

      # oxlint is not a formatter, so prettier is checked separately rather
      # than surfacing through the linter the way eslint-plugin-prettier did.
      - name: Format
        run: pnpm run format:check

      - name: Build
        run: pnpm run build

      # On a pull request this is how the result gets looked at, now that
      # there are no deploy previews: download it and open dist/index.html.
      - uses: actions/upload-artifact@v7
        with:
          name: slides
          path: dist

      # Pages wants the same directory in its own tar format. Only master is
      # ever published, so a pull request stops at the artifact above.
      - name: Package for Pages
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Split out because publishing needs permissions the build has no business
  # holding, and because the environment records the live URL.
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
