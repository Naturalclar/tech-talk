name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Must come before setup-node: the pnpm cache lookup needs pnpm on PATH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `pnpm install` also runs the `prepare` script (tsc), which is what
      # compiles scripts/ into the gitignored bin/ that `pnpm build` executes.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --with-deps installs the browser's system libraries too, which is what
      # lets this job track ubuntu-latest instead of pinning an older image.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm run lint

      # webpack 4 hashes with md4, which OpenSSL 3 (Node 17+) refuses without
      # the legacy provider.
      - name: Build
        run: pnpm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - uses: actions/upload-artifact@v4
        with:
          name: slides
          path: dist
