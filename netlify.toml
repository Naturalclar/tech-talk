# Netlify reads its build settings from here rather than the dashboard UI.
#
# NODE_VERSION matters twice over: pnpm (pinned via packageManager in
# package.json) requires Node >= 18.12, and the deploy failed on the image's
# older default; and the build scripts are TypeScript that node runs directly,
# which needs >= 22.18. "22" resolves to the latest 22.x, so it satisfies both,
# and it matches what CI runs.
#
# The build screenshots every deck, so it needs playwright's browser. Unlike
# CI this cannot use --with-deps, which installs system packages and wants
# sudo; the image already carries the shared libraries Chromium needs.

[build]
  command = "pnpm exec playwright install chromium && pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
